<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#282a5e" />
    <link rel="icon" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <title>일본어 ↔ 한국어 학습</title>
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <h1>일본어 ↔ 한국어</h1>
        <nav class="tabs">
          <button class="tab-btn active" data-tab="jp-ko">🇯🇵→🇰🇷</button>
          <button class="tab-btn" data-tab="ko-jp">🇰🇷→🇯🇵</button>
          <button class="tab-btn" data-tab="settings">설정</button>
        </nav>
      </header>

      <main>
        <section class="tab-panel active" data-panel="jp-ko">
          <textarea data-input placeholder="일본어 문장을 입력하세요…"></textarea>
          <button class="primary-btn" data-translate-btn>번역하기</button>
          <p class="status" data-status></p>
          <div class="result" data-result></div>
        </section>

        <section class="tab-panel" data-panel="ko-jp">
          <textarea data-input placeholder="한국어 문장을 입력하세요…"></textarea>
          <button class="primary-btn" data-translate-btn>번역하기</button>
          <p class="status" data-status></p>
          <div class="result" data-result></div>
        </section>

        <section class="tab-panel" data-panel="settings"></section>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
