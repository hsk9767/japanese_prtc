<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#282a5e" />
    <link rel="icon" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <title>일본어 단어장</title>
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <nav class="tabs">
          <button class="tab-btn active" data-tab="vocab">단어장</button>
          <button class="tab-btn" data-tab="settings">설정</button>
        </nav>
      </header>

      <main>
        <section class="tab-panel active" data-panel="vocab">
          <div class="level-row" id="level-row"></div>
          <p class="progress" id="progress">불러오는 중…</p>
          <div class="action-row">
            <button class="primary-btn" id="new-words-btn">새 단어</button>
            <button class="secondary-btn" id="test-btn">테스트</button>
          </div>
          <p class="status" id="vocab-status"></p>
          <div id="word-list" class="word-list"></div>
        </section>

        <section class="tab-panel" data-panel="settings"></section>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
